name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  framework-light:
    name: Framework-light suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the test runner
        run: python -m pip install --upgrade pip pytest

      - name: Run the suite
        run: python -m pytest murasalat_office/tests -q

      - name: Byte-compile every module
        run: python -m compileall -q murasalat_office

      - name: Validate the metadata against itself
        run: python murasalat_office/tests/validate_metadata.py

      - name: Parse every client script and print format template
        run: |
          find murasalat_office -name '*.js' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 node --check
